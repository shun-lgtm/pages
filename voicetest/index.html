<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>セルキィ × 音楽プレイヤー プロトタイプ</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: linear-gradient(180deg, #0a1929 0%, #1a3a52 100%);
    color: #e0f2ff;
    min-height: 100vh;
    padding: 16px;
    padding-bottom: 32px;
  }
  h1 {
    font-size: 18px;
    color: #4dd0e1;
    margin-bottom: 4px;
  }
  .subtitle {
    font-size: 11px;
    color: #7fb3d5;
    margin-bottom: 16px;
  }

  .panel {
    background: rgba(26, 58, 82, 0.6);
    backdrop-filter: blur(10px);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 14px;
    border: 1px solid rgba(77, 208, 225, 0.2);
  }

  .panel-title {
    font-size: 12px;
    color: #7fb3d5;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 10px;
  }

  /* 音楽プレイヤー */
  .now-playing {
    text-align: center;
    margin-bottom: 14px;
  }
  .track-title {
    font-size: 16px;
    font-weight: bold;
    color: #4dd0e1;
    margin-bottom: 4px;
    word-break: break-all;
  }
  .track-status {
    font-size: 11px;
    color: #7fb3d5;
  }

  .file-input-wrapper {
    margin-bottom: 12px;
  }
  .file-input-label {
    display: block;
    background: #1565c0;
    color: white;
    padding: 12px;
    text-align: center;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
  }
  .file-input-label:active { background: #0d47a1; }
  input[type="file"] { display: none; }

  .playlist {
    max-height: 120px;
    overflow-y: auto;
    margin-bottom: 12px;
  }
  .playlist-item {
    padding: 8px 10px;
    background: #0d1b2a;
    border-radius: 6px;
    margin-bottom: 4px;
    font-size: 12px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .playlist-item.active {
    background: #1565c0;
    color: white;
  }
  .playlist-item-name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
  }

  .player-controls {
    display: flex;
    justify-content: center;
    gap: 12px;
    align-items: center;
  }
  .ctrl-btn {
    background: #1a3a52;
    border: 1px solid #4dd0e1;
    color: #4dd0e1;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .ctrl-btn.main {
    width: 60px;
    height: 60px;
    background: #4dd0e1;
    color: #0a1929;
    font-size: 22px;
  }
  .ctrl-btn:active { transform: scale(0.95); }

  /* セルキィパネル */
  .selkie-panel {
    background: linear-gradient(135deg, rgba(77, 208, 225, 0.15) 0%, rgba(21, 101, 192, 0.15) 100%);
    border: 1px solid rgba(77, 208, 225, 0.4);
  }
  .selkie-status {
    text-align: center;
    padding: 16px 0;
  }
  .selkie-icon {
    font-size: 36px;
    margin-bottom: 8px;
  }
  .selkie-state {
    font-size: 14px;
    font-weight: bold;
    color: #4dd0e1;
    margin-bottom: 4px;
  }
  .selkie-detail {
    font-size: 11px;
    color: #7fb3d5;
  }
  .selkie-state.recording {
    color: #ef5350;
    animation: pulse 1s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  /* ボタンガイド */
  .button-guide {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .guide-item {
    background: #0d1b2a;
    padding: 10px 8px;
    border-radius: 6px;
    text-align: center;
  }
  .guide-icon {
    font-size: 18px;
    margin-bottom: 4px;
  }
  .guide-label {
    font-size: 10px;
    color: #7fb3d5;
    margin-bottom: 2px;
  }
  .guide-action {
    font-size: 11px;
    color: #4dd0e1;
    font-weight: bold;
  }

  /* イベントログ */
  .log {
    background: #0d1b2a;
    border-radius: 8px;
    padding: 10px;
    max-height: 30vh;
    overflow-y: auto;
    font-family: monospace;
    font-size: 10px;
    line-height: 1.5;
  }
  .log-entry {
    padding: 5px 8px;
    margin-bottom: 3px;
    background: #1a2c3d;
    border-radius: 4px;
    border-left: 2px solid #4dd0e1;
  }
  .log-entry.music { border-left-color: #66bb6a; }
  .log-entry.selkie { border-left-color: #ef5350; }
  .log-entry.bg { border-left-color: #ab47bc; }
  .log-time { color: #7fb3d5; font-size: 9px; }
  .log-empty {
    color: #5a7a90;
    text-align: center;
    padding: 16px;
    font-style: italic;
  }

  /* ダッキング表示 */
  .ducking-indicator {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 10px;
    margin-left: 8px;
    background: #ff9800;
    color: white;
  }
  .ducking-indicator.hidden { display: none; }
</style>
</head>
<body>
  <h1>🎣 セルキィ × 音楽プレイヤー</h1>
  <div class="subtitle">フィジビリ検証用プロトタイプ</div>

  <!-- 音楽プレイヤー -->
  <div class="panel">
    <div class="panel-title">🎵 Music Player</div>

    <div class="now-playing">
      <div class="track-title" id="trackTitle">— 楽曲未選択 —</div>
      <div class="track-status">
        <span id="trackStatus">停止中</span>
        <span class="ducking-indicator hidden" id="duckingIndicator">DUCKING</span>
      </div>
    </div>

    <div class="file-input-wrapper">
      <label class="file-input-label" for="fileInput">📁 mp3ファイルを追加</label>
      <input type="file" id="fileInput" accept="audio/*" multiple>
    </div>

    <div class="playlist" id="playlist">
      <div class="log-empty">楽曲を追加してください</div>
    </div>

    <div class="player-controls">
      <button class="ctrl-btn" onclick="prevTrack()">⏮</button>
      <button class="ctrl-btn main" onclick="togglePlay()" id="playButton">▶</button>
      <button class="ctrl-btn" onclick="nextTrack()">⏭</button>
    </div>
  </div>

  <!-- セルキィ -->
  <div class="panel selkie-panel">
    <div class="panel-title">🐬 Selkie</div>
    <div class="selkie-status">
      <div class="selkie-icon" id="selkieIcon">💤</div>
      <div class="selkie-state" id="selkieState">待機中</div>
      <div class="selkie-detail" id="selkieDetail">▶ボタン（再生）でセルキィに話しかけられるよ</div>
    </div>
  </div>

  <!-- ボタンガイド -->
  <div class="panel">
    <div class="panel-title">🎮 ボタン割り当て</div>
    <div class="button-guide">
      <div class="guide-item">
        <div class="guide-icon">⏮</div>
        <div class="guide-label">戻る</div>
        <div class="guide-action">前の曲</div>
      </div>
      <div class="guide-item">
        <div class="guide-icon">▶</div>
        <div class="guide-label">再生/停止</div>
        <div class="guide-action">セルキィ起動</div>
      </div>
      <div class="guide-item">
        <div class="guide-icon">⏭</div>
        <div class="guide-label">次へ</div>
        <div class="guide-action">次の曲</div>
      </div>
    </div>
  </div>

  <!-- イベントログ -->
  <div class="panel">
    <div class="panel-title">📋 イベントログ</div>
    <div class="log" id="log">
      <div class="log-empty">イベントを待機中...</div>
    </div>
  </div>

<script>
// ========== 状態管理 ==========
const state = {
  playlist: [],          // [{name, url, file}]
  currentIndex: -1,
  audio: null,
  isPlaying: false,
  selkieState: 'idle',   // 'idle' | 'recording' | 'processing' | 'speaking'
  ducking: false,
  recordingTimer: null,
  events: []
};

// ========== DOM参照 ==========
const $ = id => document.getElementById(id);
const trackTitle = $('trackTitle');
const trackStatus = $('trackStatus');
const playlistEl = $('playlist');
const playButton = $('playButton');
const selkieIcon = $('selkieIcon');
const selkieState = $('selkieState');
const selkieDetail = $('selkieDetail');
const duckingIndicator = $('duckingIndicator');
const logEl = $('log');

// ========== ログ ==========
function log(type, message) {
  const time = new Date().toTimeString().substring(0, 8);
  state.events.unshift({ time, type, message });
  if (state.events.length > 50) state.events.pop();
  renderLog();
}

function renderLog() {
  if (state.events.length === 0) {
    logEl.innerHTML = '<div class="log-empty">イベントを待機中...</div>';
    return;
  }
  logEl.innerHTML = state.events.map(e =>
    `<div class="log-entry ${e.type}">
      <span class="log-time">${e.time}</span> ${e.message}
    </div>`
  ).join('');
}

// ========== ファイル追加 ==========
$('fileInput').addEventListener('change', (e) => {
  const files = Array.from(e.target.files);
  files.forEach(file => {
    const url = URL.createObjectURL(file);
    state.playlist.push({ name: file.name, url, file });
    log('music', `楽曲追加: ${file.name}`);
  });
  renderPlaylist();
  if (state.currentIndex === -1 && state.playlist.length > 0) {
    selectTrack(0);
  }
});

// ========== プレイリスト ==========
function renderPlaylist() {
  if (state.playlist.length === 0) {
    playlistEl.innerHTML = '<div class="log-empty">楽曲を追加してください</div>';
    return;
  }
  playlistEl.innerHTML = state.playlist.map((track, i) =>
    `<div class="playlist-item ${i === state.currentIndex ? 'active' : ''}" onclick="selectTrack(${i})">
      <span class="playlist-item-name">${i === state.currentIndex && state.isPlaying ? '🎵 ' : ''}${track.name}</span>
    </div>`
  ).join('');
}

function selectTrack(index) {
  if (index < 0 || index >= state.playlist.length) return;
  state.currentIndex = index;
  const track = state.playlist[index];
  trackTitle.textContent = track.name;

  if (state.audio) {
    state.audio.pause();
    state.audio.src = '';
  }

  state.audio = new Audio(track.url);
  state.audio.addEventListener('play', () => {
    state.isPlaying = true;
    trackStatus.textContent = '再生中';
    playButton.textContent = '⏸';
    updateMediaSession();
    renderPlaylist();
    log('music', `▶ 再生開始: ${track.name}`);
  });
  state.audio.addEventListener('pause', () => {
    state.isPlaying = false;
    trackStatus.textContent = '停止中';
    playButton.textContent = '▶';
    if ('mediaSession' in navigator) {
      navigator.mediaSession.playbackState = 'paused';
    }
    renderPlaylist();
  });
  state.audio.addEventListener('ended', () => {
    log('music', '楽曲終了 → 次の曲へ');
    nextTrack();
  });

  renderPlaylist();
  log('music', `楽曲選択: ${track.name}`);
}

// ========== 再生コントロール ==========
function togglePlay() {
  if (!state.audio) {
    log('music', '⚠ 楽曲が選択されていません');
    return;
  }
  if (state.isPlaying) {
    state.audio.pause();
    log('music', '⏸ 一時停止');
  } else {
    state.audio.play().catch(err => log('music', `⚠ 再生失敗: ${err.message}`));
  }
}

function nextTrack() {
  if (state.playlist.length === 0) return;
  const next = (state.currentIndex + 1) % state.playlist.length;
  const wasPlaying = state.isPlaying;
  selectTrack(next);
  if (wasPlaying) state.audio.play();
  log('music', '⏭ 次の曲');
}

function prevTrack() {
  if (state.playlist.length === 0) return;
  const prev = (state.currentIndex - 1 + state.playlist.length) % state.playlist.length;
  const wasPlaying = state.isPlaying;
  selectTrack(prev);
  if (wasPlaying) state.audio.play();
  log('music', '⏮ 前の曲');
}

// ========== ダッキング ==========
function startDucking() {
  if (!state.audio || !state.isPlaying) return;
  state.ducking = true;
  state.audio.volume = 0.2;  // 20%まで下げる
  duckingIndicator.classList.remove('hidden');
  log('music', '🔉 ダッキング開始（音量20%）');
}

function endDucking() {
  if (!state.audio) return;
  state.ducking = false;
  state.audio.volume = 1.0;
  duckingIndicator.classList.add('hidden');
  log('music', '🔊 ダッキング解除（音量100%）');
}

// ========== Media Session ==========
function updateMediaSession() {
  if (!('mediaSession' in navigator)) return;

  const track = state.playlist[state.currentIndex];
  if (track) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: track.name,
      artist: 'セルキィプレイヤー',
      album: 'Phase 4 プロトタイプ'
    });
  }
  navigator.mediaSession.playbackState = state.isPlaying ? 'playing' : 'paused';
}

if ('mediaSession' in navigator) {
  // ▶ ボタン → セルキィ起動（割り当て変更）
  navigator.mediaSession.setActionHandler('play', () => {
    log('selkie', '🎮 [▶ボタン] → セルキィ起動');
    triggerSelkie();
  });
  navigator.mediaSession.setActionHandler('pause', () => {
    log('selkie', '🎮 [⏸ボタン] → セルキィ起動');
    triggerSelkie();
  });

  // ⏭ ⏮ → 曲送り
  navigator.mediaSession.setActionHandler('nexttrack', () => {
    log('music', '🎮 [⏭ボタン] → 次の曲');
    nextTrack();
  });
  navigator.mediaSession.setActionHandler('previoustrack', () => {
    log('music', '🎮 [⏮ボタン] → 前の曲');
    prevTrack();
  });
}

// ========== セルキィ動作シミュレーション ==========
function triggerSelkie() {
  if (state.selkieState !== 'idle') {
    log('selkie', '⚠ セルキィは現在処理中');
    return;
  }
  startRecording();
}

function startRecording() {
  state.selkieState = 'recording';
  selkieIcon.textContent = '🎙';
  selkieState.textContent = '録音中...';
  selkieState.classList.add('recording');
  selkieDetail.textContent = '話しかけてください（3秒で自動停止）';
  startDucking();
  log('selkie', '🎙 録音開始');

  // 3秒で自動停止（プロトタイプなので固定）
  state.recordingTimer = setTimeout(() => {
    stopRecording();
  }, 3000);
}

function stopRecording() {
  clearTimeout(state.recordingTimer);
  state.selkieState = 'processing';
  selkieIcon.textContent = '💭';
  selkieState.textContent = '処理中...';
  selkieState.classList.remove('recording');
  selkieDetail.textContent = 'STT → Claude API → TTS（シミュレーション）';
  log('selkie', '⏹ 録音停止 → 処理開始');

  // 1.5秒でセルキィが返事
  setTimeout(() => {
    speakResponse();
  }, 1500);
}

function speakResponse() {
  state.selkieState = 'speaking';
  selkieIcon.textContent = '🗣';
  selkieState.textContent = '応答中';
  selkieDetail.textContent = '「うんうん、わかった〜」';
  log('selkie', '🗣 応答再生');

  // 2秒で待機状態に戻る
  setTimeout(() => {
    state.selkieState = 'idle';
    selkieIcon.textContent = '💤';
    selkieState.textContent = '待機中';
    selkieDetail.textContent = '▶ボタン（再生）でセルキィに話しかけられるよ';
    endDucking();
    log('selkie', '✓ 応答完了 → 待機');
  }, 2000);
}

// ========== バックグラウンド検知 ==========
document.addEventListener('visibilitychange', () => {
  log('bg', document.hidden ? '📱 画面非表示' : '📱 画面表示に復帰');
});

// 初期ログ
log('bg', `起動完了 / Media Session: ${('mediaSession' in navigator) ? '対応' : '非対応'}`);
</script>
</body>
</html>
